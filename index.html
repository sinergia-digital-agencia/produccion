<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#591D33">
<title>Producción — Sinergia Digital</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --vino:#591D33;--vino-mid:#7a2845;--vino-light:#f9f0f3;--lila:#D6BBF2;--lemon:#F6FFA1;--azul:#93A2FD;--terra:#BF4F26;
  --bg:#f4f1f2;--surface:#fff;--surface2:#f8f5f6;--text:#1a1010;--text2:#6b5057;--text3:#9e8089;
  --border:#ede0e3;--border2:#d9c8cc;--r:10px;--rs:7px;--rl:14px;
}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
.topbar{background:var(--vino);color:#fff;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.brand b{font-size:15px;display:block;line-height:1.1}.brand small{font-size:11px;opacity:.65}
.top-right{display:flex;align-items:center;gap:12px;font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:5px}
.dot.err{background:#f87171}.dot.sync{background:#fbbf24}
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:12px 14px;border:none;background:transparent;border-bottom:2px solid transparent;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.nav button.on{color:var(--vino);border-bottom-color:var(--vino);background:var(--vino-light)}
.content{padding:18px;max-width:1200px;margin:0 auto}
h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:14px}
.sub{color:var(--text3);font-size:12px}
.btn{padding:8px 14px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--vino);border-color:var(--vino);color:#fff}.btn.p:hover{background:var(--vino-mid)}
.btn.d{background:#fbe9e3;border-color:#f0c4b3;color:#8a3516}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--rs);background:#fff;color:var(--text);font-size:13px;font-family:inherit;max-width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--vino);box-shadow:0 0 0 3px rgba(89,29,51,.1)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:10px 0 4px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-pend{background:#f1ecee;color:#6b5057}.b-curso{background:#e3e7ff;color:#2d3a9e}.b-rev{background:#ede5fb;color:#3d2070}
.b-cambios{background:#f9dfd3;color:#8a3516}.b-listo{background:#d4edda;color:#155724}.b-vino{background:var(--vino-light);color:var(--vino)}
.b-azul{background:#e3e7ff;color:#2d3a9e}
.empty{text-align:center;color:var(--text3);padding:26px 10px;font-size:13px}
.alert{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:10px;border-left:3px solid}
.alert.w{background:#fff8d6;border-color:#e6c200;color:#6b5600}.alert.r{background:#fbe9e3;border-color:var(--terra);color:#8a3516}.alert.g{background:#e4f5e8;border-color:#28a745;color:#155724}.alert.i{background:#eef0ff;border-color:var(--azul);color:#2d3a9e}
/* calendario */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;min-height:120px}
.day.hoy{border-color:var(--vino);box-shadow:0 0 0 2px rgba(89,29,51,.12)}
.day.we{background:var(--surface2)}
.day h4{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.task{border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:var(--rs);padding:6px 8px;margin-bottom:6px;cursor:pointer;background:#fff;font-size:12px}
.task:hover{background:var(--surface2)}
.task b{display:block;font-size:12px}.task span{color:var(--text3);display:block}
.t-pend{border-left-color:#bdaab0}.t-curso{border-left-color:var(--azul)}.t-rev{border-left-color:var(--lila)}.t-cambios{border-left-color:var(--terra)}.t-listo{border-left-color:#28a745;opacity:.65}
.task.late{background:#fff3ef}
/* carga */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:center}
.tbl th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;background:var(--surface2)}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.cg-ok{background:#d4edda;color:#155724}.cg-warn{background:var(--lemon);color:#5c4a00}.cg-over{background:#f3c5b3;color:#8a3516;font-weight:700}.cg-na{background:#f5f5f5;color:#6b5057}
.cg small{opacity:.7;font-weight:400}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.check-grid label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--rs);font-size:13px;cursor:pointer}
.check-grid label input{width:16px;height:16px;padding:0;accent-color:var(--vino)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.chk input{width:16px;height:16px;padding:0;accent-color:var(--vino)}
.modal .chk input{width:16px}
.prog{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:#28a745}
/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(89,29,51,.42);z-index:200;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--rl);padding:20px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:2px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal select,.modal input,.modal textarea{width:100%}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.steps div{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;background:var(--surface2);border-radius:5px}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--vino)}
.login .box{background:#fff;border-radius:var(--rl);padding:28px;width:100%;max-width:360px;text-align:center}
.login h1{font-size:20px;color:var(--vino);margin-bottom:4px}
.login input{width:100%;margin:14px 0 10px;text-align:center;font-size:16px}
.login .err{color:#8a3516;font-size:12px;min-height:16px;margin-bottom:8px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600;color:var(--vino)}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--vino);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.b-warn{background:var(--lemon);color:#5c4a00}.b-over{background:#f9dfd3;color:#8a3516}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:var(--r);padding:12px 14px}
.kpi small{display:block;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi b{font-size:24px;letter-spacing:-.02em;display:block;margin:2px 0}.kpi span{display:block;font-size:11px;color:var(--text3)}
.kpi.ok{border-left-color:#28a745}.kpi.warn{border-left-color:#e6c200}.kpi.over{border-left-color:var(--terra)}
.tbl.tb th,.tbl.tb td{text-align:left;vertical-align:top}.tbl.tb td.free{background:var(--lemon);color:#5c4a00;font-style:italic}.tbl.tb td.bad{background:#f9dfd3}
.chipc{display:inline-block;background:var(--vino-light);color:var(--vino);border-radius:12px;padding:2px 9px;margin:2px;font-size:12px;font-weight:600}
.phase-chips{display:flex;gap:6px;flex-wrap:wrap}.pchip{border:1px solid var(--border2);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text)}.pchip:hover{background:var(--surface2)}.pchip.on{background:var(--vino);color:#fff;border-color:var(--vino)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:4px}.legend .lg{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lchip{border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;background:#fff}.lchip:hover{background:var(--surface2)}
.guia{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-top:12px;font-size:12px}.guia ul{margin:6px 0 0 16px}.guia li{margin-bottom:3px}
.heat{border-collapse:collapse;font-size:11px}
.heat th,.heat td{border:1px solid var(--border);text-align:center;padding:4px 2px;min-width:30px}
.heat th{background:var(--surface2);color:var(--text2);font-weight:600;line-height:1.25}
.heat .who{min-width:140px;text-align:left;padding:6px 10px;background:#fff;position:sticky;left:0;z-index:1}
.heat td.off,.heat th.off{background:repeating-linear-gradient(45deg,#f4f1f2,#f4f1f2 4px,#ebe4e6 4px,#ebe4e6 8px)}
.heat td.c{height:40px;font-weight:600;cursor:default}
.heat th.hoy,.heat td.hoy{box-shadow:inset 0 0 0 2px var(--azul)}
.heat td.aus{background:repeating-linear-gradient(45deg,#ede5fb,#ede5fb 4px,#ddd0f5 4px,#ddd0f5 8px)}
.heat td.tot{min-width:64px;font-size:12px}
@media(max-width:900px){
  .week{grid-template-columns:1fr}.day{min-height:0}
  .content{padding:12px}.topbar{padding:0 12px}.top-right .hide-m{display:none}
  .overlay{align-items:flex-end;padding:0}.modal{border-radius:var(--rl) var(--rl) 0 0;max-width:100%}
  input,select,textarea{font-size:16px}
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <div style="font-size:34px;color:var(--vino)"><i class="ti ti-calendar-event"></i></div>
    <h1>Producción · Sinergia Digital</h1>
    <p class="sub">Ingresa el código del equipo</p>
    <input type="password" id="code" placeholder="Código" autocomplete="off">
    <div class="err" id="login-err"></div>
    <button class="btn p" style="width:100%;justify-content:center" data-act="entrar">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><div class="brand-logo"><i class="ti ti-calendar-event"></i></div><div><b>Producción</b><small>Sinergia Digital</small></div></div>
    <div class="top-right"><span><span class="dot" id="dot"></span><span id="estado-sync">Sincronizado</span></span><span class="hide-m" id="hoy-label"></span><button class="btn sm" id="guia" data-act="guia" title="Cómo usar esta app"><i class="ti ti-help-circle"></i></button><a class="btn sm" id="manual" target="_blank" rel="noopener" hidden title="Manual de procesos"><i class="ti ti-book"></i></a><button class="btn sm" data-act="recargar" title="Actualizar"><i class="ti ti-refresh"></i></button><button class="btn sm" data-act="salir" title="Salir"><i class="ti ti-logout"></i></button></div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="content" id="main"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="loading" id="loading" hidden><div class="spin"></div><span id="loading-txt">Cargando…</span></div>

<script>
// ═════════ CONFIG ═════════
const API = 'https://script.google.com/macros/s/AKfycbzZ7vgrgejhuqKXuL_c629VSNt5mesLlnfnxC_PBDiYfmt0-j1_MY1eMPIe4lE8ohAqGQ/exec';

// ═════════ LÓGICA PURA (calendario laboral, capacidad, plan hacia atrás, fases, métricas) ═════════
// <<PURE
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => new Date(s + 'T12:00:00');
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const lunes = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmt(d); };
const mod = (a, n) => ((a % n) + n) % n;
const num = (v, d) => { const x = parseFloat(v); return isNaN(x) ? d : x; };
function mesAdd(ym, n) { const p = ym.split('-').map(Number); const t = p[0] * 12 + (p[1] - 1) + n; return Math.floor(t / 12) + '-' + pad(mod(t, 12) + 1); }
function finMes(ym) { const p = ym.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); }

// ── Calendario laboral: lunes a sábado (sábado hasta el mediodía). Sin domingos ni feriados ──
// Jueves y Viernes Santo de un año (Pascua por el algoritmo gregoriano): cambian cada año, así que se calculan solos
function pascuaDe(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1, pascua = y + '-' + pad(mes) + '-' + pad(dia);
  return pascua;
}
const semanaSanta = y => { const p = pascuaDe(y); return [addDays(p, -3), addDays(p, -2)]; };
// Festivos de Colombia (Ley 51 de 1983 «Emiliani»: la mayoría se pasa al lunes siguiente; Semana Santa y las fechas de Pascua se calculan)
function feriadosColombia(y) {
  const p = pascuaDe(y), lun = f => { const d = parse(f).getDay(); return addDays(f, (8 - d) % 7); };   // si ya es lunes, se queda
  const L = [y + '-01-01', y + '-05-01', y + '-07-20', y + '-08-07', y + '-12-08', y + '-12-25'];
  ['01-06', '03-19', '06-29', '08-15', '10-12', '11-01', '11-11'].forEach(x => L.push(lun(y + '-' + x)));
  if (y >= 2026) L.push(lun(y + '-07-09'));   // Ley 2578 de 2026: Nuestra Señora del Rosario de Chiquinquirá
  [-3, -2, 43, 64, 71].forEach(n => L.push(addDays(p, n)));   // Jueves y Viernes Santo; Ascensión, Corpus Christi y Sagrado Corazón (al lunes)
  return L.sort();
}
// Feriados de Perú (la lista) y, en la propiedad .co, los de Colombia (para quien trabaja con ese calendario)
const parseFeriados = (txt, txtCO) => {
  const l = String(txt || '').split(',').map(s => s.trim()).filter(Boolean), co = String(txtCO || '').split(',').map(s => s.trim()).filter(Boolean);
  for (let y = 2024; y <= 2036; y++) { semanaSanta(y).forEach(f => l.push(f)); feriadosColombia(y).forEach(f => co.push(f)); }
  l.co = co; return l;
};
const feriadosDe = (p, fer) => (p && p.pais === 'CO' && fer && fer.co) ? fer.co : fer;
const esFeriado = (f, fer) => fer.indexOf(f) >= 0 || fer.indexOf(f.slice(5)) >= 0;
const esLab = (f, fer) => parse(f).getDay() !== 0 && !esFeriado(f, fer);
function prevLab(f, fer) { let g = f; for (let i = 0; i < 14 && !esLab(g, fer); i++) g = addDays(g, -1); return g; }
function nextLab(f, fer) { let g = f; for (let i = 0; i < 14 && !esLab(g, fer); i++) g = addDays(g, 1); return g; }
function addLab(f, n, fer) { let g = f, k = Math.abs(n); const s = n < 0 ? -1 : 1; while (k > 0) { g = addDays(g, s); if (esLab(g, fer)) k--; } return g; }
// Ausencias de una persona: "2026-12-20/2027-01-03, 2026-11-10" (rango o día suelto, separados por coma)
const enAusencia = (p, f) => String((p || {}).ausencias || '').split(',').some(r => { const t = r.trim().split('/'), a = t[0], b = t[1] || t[0]; return !!a && f >= a && f <= b; });
// Horas que una persona tiene ese día (L–V una cifra, sábado otra; 0 en domingos, feriados y ausencias)
const horasDelDia = (p, f, fer) => (!esLab(f, feriadosDe(p, fer)) || enAusencia(p, f) ? 0 : (parse(f).getDay() === 6 ? num((p || {}).horasSab, 4) : num((p || {}).horasDia, 8)));
const capSemana = (p, lun, fer) => { let s = 0; for (let i = 0; i < 7; i++) s += horasDelDia(p, addDays(lun, i), fer); return s; };
// Lo que le queda libre a una persona ese día, descontando lo que ya tiene comprometido (ocup[nombre][fecha])
const capDisp = (p, f, fer, ocup) => Math.max(0, horasDelDia(p, f, fer) - ((((ocup || {})[(p || {}).nombre]) || {})[f] || 0));
const capMes = (p, ym, fer) => { let s = 0; for (let d = 1; d <= finMes(ym); d++) s += horasDelDia(p, ym + '-' + pad(d), fer); return s; };

const piezasTanda = (piezas, tandas, j) => { piezas = parseInt(piezas) || 0; return Math.floor(piezas / tandas) + (j <= piezas % tandas ? 1 : 0); };
const piezasPrevias = (piezas, tandas, j) => { let s = 0; for (let i = 1; i < j; i++) s += piezasTanda(piezas, tandas, i); return s; };
// Si el cliente tiene asignada a una persona para ese rol (asig = {edicion: 'camila'}), se usa; si no, la primera con ese rol
// Un rol puede tener varias personas en un cliente (asig = {grabacion: 'aleja+evo'}): todas reciben la tarea
const idsAsig = (asig, rol) => String((asig && asig[rol]) || '').split('+').map(x => x.trim()).filter(Boolean);
// Grabar: las horas son POR VIDEO y por persona que graba. Los videos se reparten entre las que van
// (4 videos entre 2 personas = 2 y 2) y graban a la vez: cada una carga con sus horas el mismo día.
function horasGrabacion(piezas, k, hPorVideo) {
  const n = parseInt(piezas) || 0, kk = Math.max(1, k), base = Math.floor(n / kk), extra = n % kk;
  return Array.from({ length: kk }, (_, i) => Math.round((base + (i < extra ? 1 : 0)) * num(hPorVideo, 0) * 100) / 100);
}
function personasDe(rol, equipo, asig) {
  if (rol === 'cliente') return [];
  const ps = idsAsig(asig, rol).map(id => equipo.find(x => x.id === id && x.activo !== 'NO')).filter(Boolean);
  if (ps.length) return ps;
  const p = personaDe(rol, equipo, asig); return p ? [p] : [];
}
function personaDe(rol, equipo, asig) {
  if (rol === 'cliente') return null;
  const p = idsAsig(asig, rol).map(id => equipo.find(x => x.id === id && x.activo !== 'NO')).filter(Boolean)[0];
  return p || equipo.find(x => x.activo !== 'NO' && String(x.roles || '').split(',').map(r => r.trim()).includes(rol)) || null;
}
function asignar(rol, equipo, asig) { if (rol === 'cliente') return 'Cliente'; const p = personaDe(rol, equipo, asig); return p ? p.nombre : ''; }

// ── Un bloque de trabajo: retrocede desde el último día hasta juntar las horas que hacen falta ──
function bloque(horas, p, fin, fer, ocup) {
  const dias = []; let g = prevLab(fin, fer), acc = 0;
  for (let i = 0; i < 400; i++) {
    const c = capDisp(p, g, fer, ocup);
    if (c > 0) { dias.unshift(g); acc += c; }
    if (dias.length && acc + 1e-9 >= horas) break;
    g = addDays(g, -1);
  }

async function accionPieza(act, cid, ciclo, pz) {

  }

  if (act === 'pz-copycambios') { motivo = prompt('¿Qué ajuste de copy pidió el cliente?'); if (motivo === null) return; motivo = motivo.trim() || 'sin detalle'; }
  if (act === 'pz-clicambios') { motivo = prompt('¿Qué cambio pidió el cliente?'); if (motivo === null) return; motivo = motivo.trim() || 'sin detalle'; }
  let extra = false;
  await conSync(async () => {
    if (act === 'pz-guion') await patchTarea(p.guion.id, { estado: 'Listo' });

      const txt = 'Calidad: ' + motivo;

      if (p.edicion) await patchTarea(p.edicion.id, { estado: 'Con cambios', notas: nota(p.edicion, txt) });
    } else if (act === 'pz-copycambios') {
      const g = p.guion, ronda = (parseInt(g.rondas) || 0) + 1;
      await patchTarea(g.id, { estado: 'Con cambios', rondas: ronda, notas: nota(g, 'Ajuste de copy ' + ronda + ' (cliente): ' + motivo) });
      if (ronda > rondasCopy() && confirm('Este ajuste supera los ' + rondasCopy() + ' ajuste(s) de copy incluidos en el plan. Según la política se cotiza como extra. ¿Lo registro como pedido fuera del plan?')) {
        extra = await guardarExtra('Guion ' + pz + ' (' + g.cliente + '): ajuste de copy ' + ronda + '. ' + motivo, 'Extra cotizado', cid);
      }
    } else if (act === 'pz-cliok') await patchTarea(p.revvideo.id, { estado: 'Listo' });
    else if (act === 'pz-clicambios') {
      const rv = p.revvideo, ronda = (parseInt(rv.rondas) || 0) + 1, txt = 'Ronda ' + ronda + ' (cliente): ' + motivo;
      await patchTarea(rv.id, { estado: 'Con cambios', rondas: ronda, notas: nota(rv, txt) });
      if (p.edicion) await patchTarea(p.edicion.id, { estado: 'Con cambios', notas: nota(p.edicion, txt) });
      if (ronda > rondasMax() && confirm('Este cambio supera las ' + rondasMax() + ' ronda(s) incluidas en el plan. Según la política se cotiza como extra o reemplaza otra pieza. ¿Lo registro como pedido fuera del plan?')) {
        extra = await guardarExtra('Pieza ' + pz + ' (' + rv.cliente + '): ronda ' + ronda + ' de cambios. ' + motivo, 'Extra cotizado', cid);
      }
    } else if (act === 'pz-reenviar') {

    }
    if (extra) await cargar();
  });
}

async function usarPlan() {

  try {
    for (const x of P.plan) { const pl = x.plan || {}, mismo = pl.envio && pl.material && pl.envio.slice(0, 7) === x.entrega.slice(0, 7) && pl.material.slice(0, 7) === x.entrega.slice(0, 7) && pl.envio < pl.material && pl.material < x.entrega;
      const r = await api('saveCronograma', { d: Object.assign(cronoFila(x.item.c.id), { entregas: String(parseInt(x.entrega.slice(8))), diaGuiones: mismo ? parseInt(pl.envio.slice(8)) : '', diaMaterial: mismo ? parseInt(pl.material.slice(8)) : '' }) }); if (!r.ok) throw new Error(r.error); }
    await cargar(); render(); alert('Fechas guardadas. Ahora, en Clientes, borra los lotes de este ciclo que aún no empezaron y genera los lotes con las fechas nuevas.');
  } catch (e) { alert('Error: ' + e.message); }

async function aplicarCola() {
  const C = colaEdicion(); if (!C.filas.length) return;
  const fer = FER(), t = [];
  C.filas.forEach(f => {
    const r = f.res, l = f.l;
    Object.keys(r.edit).forEach(id => t.push([id, r.edit[id]])); Object.keys(r.qa).forEach(id => t.push([id, r.qa[id]]));
    const ent = l.lote.entrega, old = ent ? ent.fecha : null, nuevo = old && r.fin ? (r.fin > old ? r.fin : old) : old;
    if (ent && nuevo !== old) {
      const delta = habilesEntre(old, nuevo);
      l.tareas.forEach(x => { if (x.estado === 'Listo') return; const e = S.etapas.find(y => y.key === x.etapa), anc = e && e.ancla; if (x.id === ent.id || anc === 'entrega') t.push([x.id, nuevo]); else if (anc === 'revision') t.push([x.id, addLab(x.fecha, delta, fer)]); });
    }
  });
  if (!t.length) { alert('No hay nada que reprogramar'); return; }
  if (!confirm('Se reprogramarán ' + t.length + ' tareas pendientes según lo que se alcanza de verdad con las horas de cada persona. No se toca lo ya hecho.\n\nDespués, en Ajustes, sincroniza el Google Calendar. ¿Continuar?')) return;
  loading(true, 'Reprogramando…');
  try { for (let i = 0; i < t.length; i += 90) { const r = await api('setFechas', { d: { t: t.slice(i, i + 90) } }); if (!r.ok) throw new Error(r.error); } await cargar(); render(); } catch (e) { alert('Error: ' + e.message); }
  loading(false);
}

  else if (t.id === 'f-dgui' || t.id === 'f-dmat' || t.id === 'f-entregas' || t.id === 'f-onb' || (t.closest && t.closest('#f-asig-onboarding'))) evalFechasUI();
  else if (t.id === 'le-piezas' || t.id === 'le-fecha' || (t.closest && t.closest('#le-incl'))) prevLoteExtra();
});
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') entrar($('code').value.trim()); });

// ═════════ INICIO ═════════
(function init() { const guardado = lsGet('prod_code'); if (guardado) entrar(guardado); })();
</script>
